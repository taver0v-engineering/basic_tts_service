<!--
  Read Aloud favicon: a purely abstract two-circle mark, not a book, a
  speaker, or a microphone. It doesn't depict what the app does — it's
  just a bold, colorful shape that's easy to tell apart from other tabs
  and impossible to mistake for a browser-native icon (e.g. the
  "tab is playing audio" speaker badge some browsers overlay).

  Plain SVG (no build step, no external tool, no font dependency since it's
  pure shapes) so it's trivial to re-generate or restyle.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#6f8f5c"/>
  <circle cx="13" cy="16" r="8" fill="#f5f2e8"/>
  <circle cx="21" cy="16" r="6" fill="#2f7d68"/>
</svg>
