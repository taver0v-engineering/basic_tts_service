<!--
  Read Aloud favicon: a big rectangle with a smaller rectangle nested
  inside it, a purely abstract mark — not a book, speaker, or microphone,
  and not a circular shape either (an earlier circle-based version read as
  a speaker/volume icon at 16px, which is exactly the kind of browser-
  native "this tab is playing audio" badge this favicon needs to stay
  distinct from).

  Plain SVG (no build step, no external tool, no font dependency since it's
  pure shapes) so it's trivial to re-generate or restyle.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#242822"/>
  <rect x="6" y="6" width="20" height="20" rx="3" fill="#f5f2e8"/>
  <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#4da893"/>
</svg>
